set-option -g default-shell /usr/bin/zsh

# Change prefix to Ctrl-a (like GNU Screen)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Popular shortcut: Ctrl-a a switches to last active window
bind a last-window

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"

# Basic usability
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -s escape-time 0

# COLORSCHEME: Gruvbox dark (medium contrast)
set-option -g status "on"

# Default statusbar colors
set-option -g status-style bg=colour237,fg=colour223 # bg=bg1, fg=fg1

# Active pane border
set-option -g pane-active-border-style fg=colour250 # fg2

# Inactive pane border
set-option -g pane-border-style fg=colour237 # bg1

# Message styling
set-option -g message-style bg=colour239,fg=colour223
set-option -g message-command-style bg=colour239,fg=colour223

# Pane number display
set-option -g display-panes-active-colour colour250
set-option -g display-panes-colour colour237

# Status bar layout
set-option -g status-justify "left"
set-option -g status-left-length "80"
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

# Left side: session name
set-option -g status-left "#[fg=colour248, bg=colour241] #S #[fg=colour241, bg=colour237, nobold, noitalics, nounderscore] "

# Right side: prefix indicator + host
set-option -g status-right "#[fg=colour248, bg=colour237, nobold, noitalics, nounderscore]#{?client_prefix,#[reverse] ⌨ #[noreverse] ,}#[fg=colour237, bg=colour248] #h "

# Inactive window
set-window-option -g window-status-format "#[fg=#{?window_bell_flag,colour235,colour223},bg=#{?window_bell_flag,colour167,colour239}] #I |#[fg=#{?window_bell_flag,colour235,colour223}, bg=#{?window_bell_flag,colour167,colour239}] #W#{?window_bell_flag, ! , } "

# Active/current window
set-window-option -g window-status-current-format "#[fg=colour237, bg=colour214,nobold,noitalics,nounderscore] #[fg=colour239, bg=colour214,bold] #I |#[fg=colour239, bg=colour214,bold] #W #[fg=colour214, bg=colour237,nobold,noitalics,nounderscore] "
